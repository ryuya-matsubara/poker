# DRAFT ONLY. Do not install/trigger without user approval: user banned Actions calculation.
# This workflow only copies/splits existing data; no solver, training or EV calculation.
name: Split existing TT diagnostic checkpoint only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  split_saved_data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download existing complete state; no solver execution
        run: |
          mkdir -p checkpoints parts
          gh run download 36721624956 --repo "${{ github.repository }}" --name joint-80000000-seed42 --dir checkpoints
      - name: Split unchanged compressed bytes into 256MiB segments
        id: parts
        run: |
          set -euo pipefail
          sha256sum checkpoints/joint-checkpoint.gz > parts/source.sha256
          split -d -b 256M checkpoints/joint-checkpoint.gz parts/part-
          sha256sum parts/part-* > parts/segments.sha256
          count=$(find parts -name 'part-*' -type f | wc -l)
          test "$count" -le 32
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tt-joint42-manifest
          path: parts/*.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.parts.outputs.count) > 0 }}
        with:
          name: tt-joint42-part-00
          path: parts/part-00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.parts.outputs.count) > 1 }}
        with:
          name: tt-joint42-part-01
          path: parts/part-01
          compression-level: 0
          retention-days: 7
