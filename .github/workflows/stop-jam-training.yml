name: Stop training at user request
on:
  push:
    branches: [solver-jam-final]
    paths: [analysis/stop-v8-training.txt]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [36851593526]) {
              const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if (r.data.status!=='completed') await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
              core.info('Stop requested for '+run_id+'; preserved artifacts are untouched.');
            }
