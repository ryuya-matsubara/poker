name: Learn bounded postflop continuation
on:
  push:
    paths:
      - .github/workflows/experiment-joint-cfr.yml
      - tools/continuation.rs
      - tools/patch_solver.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin and patch solver
        run: |
          git clone https://github.com/exinori/DCFR-SOLVER.git solver
          git -C solver checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          test "$(git -C solver rev-parse HEAD)" = 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          python3 tools/patch_solver.py solver/src
      - name: Payoff and 20BB regression tests
        run: cargo test --release --lib --manifest-path solver/Cargo.toml preflop::
      - name: Train joint preflop and postflop CFR pilot
        run: |
          mkdir -p experiment
          /usr/bin/time -v cargo run --release --manifest-path solver/Cargo.toml -- preflop \
            --iterations 2000000 --seed 42 \
            --open-size 5 --sb-open-size 6 --bet3-size 14 --bet4-size 28 \
            --oop-pot-tax 0.00 --output experiment/blueprint.bin \
            --chart-output experiment/chart.json 2>experiment/training.log
          python3 tools/analyze_preflop_charts.py experiment/chart.json --output experiment/frequencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-cfr-pilot
          path: experiment/
          if-no-files-found: warn
