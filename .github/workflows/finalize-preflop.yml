name: Validate and publish final preflop strategy
on:
  workflow_dispatch:
    inputs:
      training_run:
        description: 'Validated 3-seed 30/60/120M training run'
        required: true
        default: '36672549658'
      ablation_run:
        description: 'Matched 9-model 30M ablation run'
        required: true
        default: '36672625198'
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: preflop-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for final training and regression tests
        env:
          TRAINING_RUN: ${{ inputs.training_run }}
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<270; attempt++) {
              const result=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.TRAINING_RUN)});
              if (result.data.status==='completed') {
                if (result.data.conclusion!=='success') throw new Error('Final training/test workflow did not pass');
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('Final training is still running');
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.training_run }}
          github-token: ${{ github.token }}
          pattern: jam-final-seed*
          path: runs
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ablation_run }}
          github-token: ${{ github.token }}
          pattern: jam-*-seed42-30m
          path: ablation
      - uses: actions/download-artifact@v4
        with:
          run-id: 36671589403
          github-token: ${{ github.token }}
          name: jam-unclipped-control-seed42-30m
          path: control
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.training_run }}
          github-token: ${{ github.token }}
          pattern: jam-blueprints-seed*
          path: blueprints
      - name: Attach actual cumulative regret and current policy to measured EV
        run: |
          for seed in 42 73 101; do
            for length in 30 60 120; do
              python3 tools/inspect_blueprint.py blueprints/jam-blueprints-seed${seed}/${length}m-blueprint.bin runs/jam-final-seed${seed}/${length}m-ev.json
            done
          done
      - name: Generate and verify exact strategy
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/promote_jam.py runs ablation --control control
          python3 tools/test_preflop_export.py
          node tools/test_preflop_frontend.cjs
          python3 tools/validate_preflop.py preflop_charts.json --policy preflop_policy.json --seed analysis/jam/seed73-120m/120m-chart.json --half analysis/jam/seed42-60m/60m-chart.json
      - name: Preserve verified data and report in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md preflop_charts.json preflop_policy.json analysis
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated signed-MCCFR continuation, EV and convergence evidence'
            git push origin HEAD:main
          fi
      - name: Wait for earlier Pages builds
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<60; attempt++) {
              const result=await github.rest.actions.listWorkflowRunsForRepo({...context.repo,per_page:30});
              const active=result.data.workflow_runs.filter(r=>r.id!==context.runId && /pages/i.test(r.name||'') && ['queued','in_progress','waiting','pending'].includes(r.status));
              if (!active.length) return;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw new Error('Earlier Pages deployment did not finish in time');
      - uses: actions/configure-pages@v5
      - name: Stage only web application files
        run: |
          mkdir public
          cp index.html preflop_charts.json preflop_policy.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify live HTML, chart and full policy
        run: |
          python3 - <<'PYCODE'
          import json,time,urllib.request
          base='https://ryuya-matsubara.github.io/poker/'
          expected={name:json.load(open(name)) for name in ['preflop_charts.json','preflop_policy.json']}
          for attempt in range(12):
              try:
                  for name,data in expected.items():
                      with urllib.request.urlopen(base+name+'?v=signed-full120m-20260930',timeout=20) as r: assert json.load(r)==data
                  with urllib.request.urlopen(base+'?v=signed-full120m-20260930',timeout=20) as r: assert 'signed-full120m-20260930' in r.read().decode()
                  print('Live HTML and both full strategy JSON files verified')
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(5)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-preflop-quality
          path: |
            analysis/quality.json
            analysis/preflop_model_fix.md
            analysis/final_frequency_169.csv
