name: Compare linear regret weighting without game changes
on:
  push:
    branches: [solver-jam-consistency]
    paths: [.github/workflows/experiment-jam-model.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [linear]
    steps:
      - uses: actions/checkout@v4
      - name: Provision solver virtual memory
        run: bash tools/provision_solver_memory.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin source and construct model
        run: |
          git clone https://github.com/exinori/DCFR-SOLVER.git solver
          git -C solver checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          python3 tools/upgrade_solver.py solver/src
      - name: Unit and randomized property tests
        env:
          POKER_MODEL: ${{ matrix.model }}
        run: |
          cargo test --release --lib --manifest-path solver/Cargo.toml preflop::
      - name: Matched training and frozen-policy action EV
        env:
          POKER_MODEL: ${{ matrix.model }}
          POKER_EV_OUTPUT: experiment/ev.json
          POKER_EV_SAMPLES: 10000
        run: |
          mkdir experiment
          /usr/bin/time -v cargo run --release --manifest-path solver/Cargo.toml -- preflop --iterations 30000000 --seed 42 --open-size 5 --sb-open-size 6 --bet3-size 14 --bet4-size 28 --oop-pot-tax 0 --output experiment/blueprint.bin --chart-output experiment/chart.json 2>experiment/training.log
          python3 tools/analyze_preflop_charts.py experiment/chart.json --output experiment/frequency.json
          cat experiment/ev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jam-${{ matrix.model }}-seed42-30m
          path: |
            experiment/*.json
            experiment/*.csv
            experiment/training.log

# Measured rank-band abstraction; same seed and iteration budget.

