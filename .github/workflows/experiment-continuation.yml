name: Diagnose sampled postflop continuation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: seed42-15m, seed: 42, iterations: 15000000}
          - {id: seed73-15m, seed: 73, iterations: 15000000}
          - {id: seed42-30m, seed: 42, iterations: 30000000}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned solver with sampled postflop continuation
        run: |
          git clone https://github.com/exinori/DCFR-SOLVER.git solver
          git -C solver checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          test "$(git -C solver rev-parse HEAD)" = 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          python3 tools/patch_solver.py solver/src
      - name: Rust and frontend regression tests
        run: |
          cargo test --release --lib --manifest-path solver/Cargo.toml preflop::
          node tools/test_preflop_frontend.cjs
      - name: Train the preflop strategy
        run: |
          mkdir -p experiment
          cargo run --release --manifest-path solver/Cargo.toml -- preflop \
            --iterations ${{ matrix.iterations }} --seed ${{ matrix.seed }} \
            --open-size 5 --sb-open-size 6 --bet3-size 14 --bet4-size 28 \
            --oop-pot-tax 0.00 \
            --output experiment/blueprint.bin \
            --chart-output experiment/chart.json
          python3 tools/export_preflop_policy.py \
            experiment/blueprint.bin experiment/policy.json \
            --max-histories 300 --min-visits 30
          python3 tools/analyze_preflop_charts.py experiment/chart.json \
            --output experiment/frequencies.json
          python3 tools/validate_preflop.py experiment/chart.json \
            --policy experiment/policy.json --output experiment/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-${{ matrix.id }}
          path: |
            experiment/chart.json
            experiment/policy.json
            experiment/frequencies.json
            experiment/frequencies.csv
            experiment/validation.json
          if-no-files-found: warn
