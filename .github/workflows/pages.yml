name: Deploy poker app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify strategy and UI
        run: |
          if python3 -c "import json,sys;sys.exit(json.load(open('analysis/quality.json')).get('release_kind')!='experimental-unconverged')"; then
            python3 tools/verify_current_snapshot.py
          else
            python3 tools/release_gate.py analysis/quality.json
          fi
          python3 tools/test_solver_analysis.py
          python3 tools/test_preflop_export.py
          python3 tools/validate_preflop.py preflop_charts.json --policy preflop_policy.json
          node tools/test_preflop_frontend.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage web application
        run: |
          mkdir public
          cp index.html preflop_charts.json preflop_policy.json public/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published strategy
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base='https://ryuya-matsubara.github.io/poker/'
          expected=json.load(open('preflop_charts.json'))
          expected_policy=json.load(open('preflop_policy.json'))
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'preflop_charts.json?v=release-20260930', timeout=20) as response:
                      actual=json.load(response)
                  with urllib.request.urlopen(base+'?v=release-20260930', timeout=20) as response:
                      html=response.read().decode()
                  assert actual == expected, 'Published chart does not match verified chart'
                  with urllib.request.urlopen(base+'preflop_policy.json?v=experimental-v8-snapshot-20261001', timeout=20) as response:
                      assert json.load(response)==expected_policy, 'Published full policy mismatch'
                  assert 'experimental-v8-snapshot-20261001' in html, 'Old HTML is still published'
                  assert '実験版（学習途中・未収束）' in html, 'Experimental disclosure missing'
                  print('Live Pages HTML and full strategy verified')
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(5)
          PY
