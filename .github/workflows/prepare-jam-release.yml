name: Prepare measured jam release
on:
  push:
    branches: [solver-jam-final]
    paths: [.github/workflows/prepare-jam-release.yml]
  workflow_dispatch:
    inputs:
      training_run:
        description: 'Validated 3-seed 30/60/120M training run'
        required: true
        default: '36674454225'
      ablation_run:
        description: 'Matched 9-model 30M ablation run'
        required: true
        default: '36674487519'
permissions:
  contents: write
  actions: read
concurrency:
  group: preflop-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solver-jam-final
      - name: Wait for final training and regression tests
        env:
          TRAINING_RUN: ${{ inputs.training_run || '36674454225' }}
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<1500; attempt++) {
              const result=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.TRAINING_RUN)});
              if (result.data.status==='completed') {
                if (result.data.conclusion!=='success') throw new Error('Final training/test workflow did not pass');
                const ablation=await github.rest.actions.getWorkflowRun({...context.repo,run_id:36674487519});
                if(ablation.data.status!=='completed') {await new Promise(resolve=>setTimeout(resolve,10000));continue;}
                if(ablation.data.conclusion!=='success') throw new Error('Required matched ablations failed');
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('Final training is still running');
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.training_run || '36674454225' }}
          github-token: ${{ github.token }}
          pattern: jam-final-seed*
          path: runs
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ablation_run || '36674487519' }}
          github-token: ${{ github.token }}
          pattern: jam-*-seed42-30m
          path: ablation
      - uses: actions/download-artifact@v4
        with:
          run-id: 36671589403
          github-token: ${{ github.token }}
          name: jam-unclipped-control-seed42-30m
          path: control
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.training_run || '36674454225' }}
          github-token: ${{ github.token }}
          pattern: jam-blueprints-seed*
          path: blueprints
      - name: Attach actual cumulative regret and current policy to measured EV
        run: |
          for seed in 42 73 101; do
            for length in 30 60 120; do
              python3 tools/inspect_blueprint.py blueprints/jam-blueprints-seed${seed}/${length}m-blueprint.bin runs/jam-final-seed${seed}/${length}m-ev.json
            done
          done
      - name: Generate and verify exact strategy
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/promote_jam.py runs ablation --control control
          python3 tools/test_preflop_export.py
          python3 tools/test_solver_analysis.py
          node tools/test_preflop_frontend.cjs
          python3 tools/validate_preflop.py preflop_charts.json --policy preflop_policy.json --seed analysis/jam/seed73-120m/120m-chart.json --half analysis/jam/seed42-60m/60m-chart.json
      - name: Preserve verified data and report in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md preflop_charts.json preflop_policy.json analysis
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated signed-MCCFR continuation, EV and convergence evidence'
            git push origin HEAD:solver-jam-final
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-jam-release
          path: |
            preflop_charts.json
            preflop_policy.json
            analysis/jam
            analysis/quality.json
            analysis/preflop_model_fix.md
            analysis/continuation_evaluation.md
