name: Verify bounded solver and isolated chance streams
on:
  push:
    branches: [solver-jam-final]
    paths: [.github/workflows/verify-jam-source.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          git clone https://github.com/exinori/DCFR-SOLVER.git solver
          git -C solver checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1
          python3 tools/patch_solver.py solver/src
          cargo test --release --lib --manifest-path solver/Cargo.toml preflop::
          python3 tools/test_preflop_export.py
          python3 tools/test_solver_analysis.py

# Compact exact-private continuation entries.
