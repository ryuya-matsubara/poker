name: Stop superseded training
on:
  push:
    branches: [solver-jam-final]
    paths: [.github/workflows/stop-superseded.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:36670797531});
            if (r.data.status!=='completed') await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:36670797531});
